<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#001166"><title>رحمانی موبایل — کامپیوتر</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--blue:#4a63c9;--org:#fdbf7b;--tx:#1d2540;--mut:#7b86a8;--card:#fff;--line:#e6ebf6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:15px Vazirmatn,Tahoma,"Segoe UI",sans-serif;direction:rtl;color:var(--tx);background:#001166;padding-bottom:120px}
button,input,select{font:inherit}
.wrap{padding:0}
.lt{max-width:520px;margin:0 auto;padding:18px 16px 0}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.mh small{display:block;color:#d3e3f7;font-size:12px}
.mh b{font-size:19px;color:#ffffff;line-height:1.6}
.ava{width:48px;height:48px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font:900 19px Georgia,serif;overflow:hidden;flex:0 0 48px;box-shadow:0 6px 14px rgba(30,70,140,.3)}
.ava img{width:100%;height:100%;object-fit:cover}
.hero{background:var(--blue);color:#fff;border-radius:28px;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;box-shadow:0 14px 28px rgba(40,70,160,.35)}
.hero b{font-size:18px;display:block;margin-bottom:6px}
.hero p{margin:4px 0;font-size:13px;opacity:.95}
.hbtn{background:#fff;color:var(--blue);border:0;border-radius:30px;padding:9px 16px;font-weight:900;margin-top:10px;cursor:pointer}
.hstat{background:rgba(255,255,255,.18);border-radius:22px;padding:14px;text-align:center;min-width:96px}
.hstat b{font-size:28px;margin:0}
.hstat small{font-size:12px}
.chips{display:flex;gap:10px;overflow-x:auto;padding:2px 0 14px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;background:#fff;color:var(--blue);border:0;border-radius:30px;padding:10px 16px;font-weight:900;cursor:pointer;box-shadow:0 4px 12px rgba(0,40,80,.08)}
.card{background:var(--card);border:0;border-radius:26px;padding:16px;margin-bottom:14px;box-shadow:0 8px 20px rgba(20,50,90,.08)}
.bh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.bh b{font-size:17px;color:var(--tx)}
.bh span{color:var(--mut);font-size:12px}
.seg{display:flex;background:#f0f3fb;border-radius:30px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:26px;padding:9px;font-weight:900;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.ic{width:46px;height:46px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;font:900 18px Vazirmatn,sans-serif;flex:0 0 46px}
.im{flex:1;min-width:0}
.im b{display:block;font-size:15px}
.im small{display:block;color:var(--mut);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ie{text-align:left;white-space:nowrap}
.ie b{display:block;color:var(--blue);font-size:14px}
.ie small{color:var(--mut);font-size:12px}
.neg{color:#e5484d;font-weight:900}
.mbar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:min(calc(100% - 28px),488px);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:var(--blue);border-radius:30px;padding:10px 8px;box-shadow:0 14px 30px rgba(30,50,130,.4);z-index:40}
.mbar button{background:transparent;border:0;color:#dfe6ff;font-weight:900;font-size:12px;padding:9px 2px;border-radius:20px;cursor:pointer}
.mbar button.on{color:#fff;background:rgba(255,255,255,.18)}
.mbar .plus{background:var(--org);color:#2a2f4d;width:58px;height:58px;border-radius:50%;justify-self:center;font:900 32px Vazirmatn,sans-serif;padding:0;line-height:1;box-shadow:0 8px 18px rgba(253,191,123,.55)}
.sheet{position:fixed;inset:0;background:rgba(10,30,70,.4);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet .sb{background:#fff;width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:20px 18px 120px;display:grid;gap:10px}
.sheet button{background:#f0f3fb;border:0;border-radius:18px;padding:15px;font-weight:900;color:var(--tx);text-align:right;cursor:pointer;font-size:15px}
.sheet button.pri{background:var(--blue);color:#fff}
label{display:block;color:var(--mut);font-size:13px;margin:0 0 4px;font-weight:700}
input,select{width:100%;background:#f3f6fc;color:var(--tx);border:1px solid var(--line);border-radius:16px;padding:12px 14px;outline:none;font-size:15px}
input:focus,select:focus{border-color:var(--blue);background:#fff}
input[readonly]{color:var(--mut)}
select option{color:#000}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fd{position:relative}
.sgl{position:absolute;z-index:45;left:0;right:0;background:#fff;color:var(--tx);border-radius:16px;box-shadow:0 10px 24px rgba(0,0,0,.15);max-height:220px;overflow:auto}
.sgl:empty{display:none}
.si{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.si:hover{background:#eef3ff}
.si small{color:var(--mut);margin-right:6px}
.ub{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px;background:#f3f6fc;border-radius:18px;padding:12px}
.ub b{color:var(--blue)}
.btn{background:var(--blue);color:#fff;border:0;border-radius:16px;padding:12px 20px;font-weight:900;cursor:pointer;margin:10px 6px 0 0}
.btn.w{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.btn.s{padding:7px 12px;font-size:13px;margin:0}
.btn.x{background:#fff;color:#e5484d;border:2px solid #e5484d;padding:5px 10px;font-size:13px}
.tot{font-weight:900;color:var(--blue);margin:10px 0}
.er{color:#e5484d;margin-top:8px}
.hd{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.hd b{color:var(--tx)!important}
h2{color:var(--tx);font-size:18px;margin:0 0 12px}
.tw{overflow-x:auto;border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th{background:var(--blue);color:#fff;padding:10px 8px;font-weight:900}
td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center;color:var(--tx)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.cards>div{background:#fff;border-radius:20px;padding:12px;text-align:center;color:var(--mut);font-size:12px;box-shadow:0 4px 12px rgba(20,50,90,.06)}
.cards b{display:block;color:var(--blue);font-size:17px;margin-top:6px}
.empty{color:var(--mut);padding:24px;text-align:center}
.lt .chart{width:100%;height:auto;display:block}
.lt .chart text{font:12px Vazirmatn,sans-serif;fill:#2b3350}
.lt .chart .ml{fill:#7b86a8}
.lt .chart line{stroke:#e6ecf8}
.lt .chart rect{fill:#a9b8e8}
.lt .chart rect:last-of-type{fill:var(--blue)}
.lt .chart path{}
.login{max-width:380px;margin:40px auto 0;background:#fff;border-radius:30px;padding:30px 24px;text-align:center;box-shadow:0 14px 30px rgba(20,50,90,.12)}
.circle{width:180px;height:180px;border-radius:50%;margin:0 auto;background:var(--blue);display:grid;place-items:center;overflow:hidden}
.circle img{width:100%;height:100%;object-fit:cover}
.circle .rh{color:#fff;font:700 64px Georgia,serif}
.login h3{color:var(--tx);font-weight:400;margin:18px 0}
.login h3 span{color:var(--blue);font-weight:900}
.login input{margin:8px 0;text-align:center}
.login .btn{width:100%;padding:14px;font-size:17px}
footer{color:#d3e3f7;text-align:center;font-size:12px;padding:12px}
#pa{display:none}
@media print{
  body{background:#fff;color:#000}
  body>*:not(#pa){display:none!important}
  #pa{display:block!important}
  .bj{border:2px solid #0b3b2e;padding:20px;color:#0b3b2e}
  .bj table th{background:#1fa971;color:#fff}
  .bj td{border-bottom:1px solid #0b3b2e}
  .bj .sig{display:flex;justify-content:space-between;margin-top:50px}
  .bjh{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #0b3b2e;padding-bottom:8px;gap:10px}
  .bjc{text-align:center}
  .bjn{font-size:20px;font-weight:700}
  .bjs{font-style:italic}
  .bjr{text-align:left;font-size:14px}
  .bja{text-align:center;margin:8px 0;font-size:13px}
  .bjcu{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0;font-size:14px}
  .bjt{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px;font-size:15px}
}

/* ---- login screen (matches the reference design) ---- */
.lscreen{position:fixed;inset:0;background:#001166;display:flex;align-items:center;justify-content:center;padding:24px 18px;overflow:auto;z-index:100;direction:rtl}
.login{max-width:500px;width:100%;margin:0 auto;background:none;box-shadow:none;padding:0;text-align:center}
.login .circle{width:330px;height:330px;max-width:80vw;max-height:80vw;aspect-ratio:1/1;margin:0 auto;background:#001166;border:3px solid #fff;border-radius:50%;overflow:hidden}
.login .circle img{width:100%;height:100%;object-fit:cover;display:block}
.login h3{color:#fff;font-weight:400;font-size:21px;margin:22px 0 22px;line-height:1.8}
.login h3 span{color:#ffc800;font-weight:900}
.login input{display:block;width:100%;background:#fff;color:#001166;border:0!important;border-radius:40px!important;padding:17px 22px;font-size:17px;margin:0 auto 14px;text-align:center;outline:none;box-shadow:none}
.login input::placeholder{color:#001166;opacity:1}
.login input:focus{background:#fff;box-shadow:0 0 0 3px #ffa800}
.login .btn{background:#ffa800;color:#001166;border-radius:40px;padding:14px 56px;font-size:20px;font-weight:900;margin:8px auto 0;width:auto;min-width:240px;display:block;box-shadow:none}
.login .er{color:#ffc800;margin-top:12px;font-weight:700}
.lsel{width:auto;background:#fff;color:#1d2540;border:0;border-radius:14px;padding:7px 10px;font-weight:900;font-size:13px;margin:0;box-shadow:0 4px 12px rgba(0,40,80,.12)}
.lsel option{color:#000}
.fp{margin-top:18px}
.fpb{background:none;border:0;color:#ffc800;font-weight:900;font-size:15px;cursor:pointer;text-decoration:underline}
.fpbox{margin-top:12px}

/* ===== v4 design ===== */
:root{--blue:#3a52d4;--bg:#eef1fa;--tx:#141b3d;--mut:#6f7a9c;--line:#e3e8f5}
body{background:var(--bg);padding-bottom:0}
.lt{max-width:none;padding:0;margin:0}
.mn{max-width:1120px;margin:0 auto;padding:0 16px 120px}
.top{background:linear-gradient(135deg,#001166,#2140c8);margin:0 -16px;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 74px;border-radius:0 0 32px 32px}
.mh{margin:0;gap:12px}.hb{display:flex;gap:8px;align-items:center}
.ib{width:42px;height:42px;border-radius:14px;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;cursor:pointer}
.ava{border:2px solid rgba(255,255,255,.7)}
main{margin-top:-56px;position:relative}
.lt footer{color:var(--mut)}
.i{flex:none}
.card,.box{background:#fff;border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 10px 30px rgba(20,35,100,.08)}
.hero{background:linear-gradient(135deg,#3a52d4,#7040f0);box-shadow:0 18px 36px rgba(58,82,212,.35)}
.chips{display:none}
.warn{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff7e6;color:#8a5200}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px;margin-bottom:14px}
.tl{position:relative;background:#fff;border:0;border-radius:20px;padding:14px 6px 12px;display:grid;gap:7px;justify-items:center;cursor:pointer;box-shadow:0 8px 22px rgba(20,35,100,.07);color:var(--tx);font-weight:700;font-size:12px;transition:transform .15s}
.tl:hover{transform:translateY(-3px)}
.ti{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2))}
.tl small{color:var(--mut)}
.bd{position:absolute;top:6px;inset-inline-end:6px;background:#e5484d;color:#fff;border-radius:12px;min-width:22px;height:22px;padding:0 6px;display:grid;place-items:center;font-size:11px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.kpi{background:#fff;border-radius:20px;padding:14px;box-shadow:0 8px 22px rgba(20,35,100,.07);display:grid;gap:4px}
.kpi span,.kpi small,.sub{color:var(--mut);font-size:12px}.kpi b{font-size:16px;color:var(--blue)}
.dgrid{display:grid;gap:14px;grid-template-columns:1fr}
.bigv{font-size:22px;font-weight:900;color:var(--blue);margin:8px 0}
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:900}.badge.ok{background:#dcfce7;color:#15803d}.badge.bad{background:#ffe4e6;color:#be123c}
.donut{display:flex;align-items:center;gap:12px}.donut svg{width:140px}.leg{list-style:none;padding:0;margin:0}.leg li{display:flex;gap:8px;align-items:center;margin:6px 0}.leg i{width:12px;height:12px;border-radius:4px}
.chart .dn{font:900 30px Vazirmatn,sans-serif;fill:#141b3d}
.mbar{background:rgba(255,255,255,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid #fff;box-shadow:0 18px 40px rgba(20,35,100,.22);padding:8px;bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.mbar button{color:var(--mut);display:grid;gap:3px;justify-items:center;font-size:11px;font-weight:700}
.mbar button.on{color:var(--blue);background:#e8ecff}
.mbar .plus{background:linear-gradient(135deg,#ffb000,#ff7a00);color:#fff;width:56px;height:56px;margin-top:-26px;place-items:center;box-shadow:0 10px 22px rgba(255,140,0,.5)}
.sheet .sb{grid-template-columns:1fr 1fr;padding-bottom:110px}
.sheet button{display:flex;gap:10px;align-items:center}
.sd{display:none;position:fixed;top:0;bottom:0;inset-inline-start:0;width:250px;background:linear-gradient(180deg,#001166,#0b2399);padding:20px 14px;flex-direction:column;gap:4px;z-index:30;overflow:auto}
.sd .br{display:flex;gap:10px;align-items:center;color:#fff;font-weight:900;margin-bottom:14px}
.sd .br img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.sd button{display:flex;gap:12px;align-items:center;width:100%;padding:12px 14px;border:0;background:none;border-radius:16px;color:#c9d2ff;font-weight:700;cursor:pointer;text-align:start}
.sd button.on{background:rgba(255,255,255,.16);color:#fff}
.fab{position:fixed;left:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,#7040f0,#3a52d4);color:#fff;display:grid;place-items:center;box-shadow:0 12px 26px rgba(80,60,220,.5);z-index:70;cursor:pointer}
.aibk{position:fixed;inset:0;background:rgba(10,20,60,.4);z-index:75}
.aip{position:fixed;z-index:80;left:0;right:0;bottom:0;height:82vh;background:#fff;border-radius:28px 28px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,40,.25);overflow:hidden}
.aih{display:flex;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(135deg,#001166,#3a52d4);color:#fff}
.aih b{flex:1}.aih em{font-style:normal;font-size:11px;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,.2)}
#aim{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.bu{max-width:88%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;line-height:1.9;font-size:14px}
.bu.u{background:var(--blue);color:#fff;align-self:flex-start}.bu.a{background:#eef1fa;align-self:flex-end}
.aic{display:flex;gap:8px;overflow-x:auto;padding:0 14px 8px}.aic button{flex:none;border:1px solid var(--line);background:#fff;color:var(--blue);border-radius:20px;padding:7px 12px;font-weight:700;font-size:12px;cursor:pointer}
.aif{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.aif input{border-radius:22px}.aif button{width:48px;border:0;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
@media(min-width:100000px){
 .sd{display:flex}.mbar,.sheet{display:none}
 .mn{margin-inline-start:250px;max-width:none;padding:0 32px 40px}
 .top{margin:0 -32px;padding:26px 32px 84px}
 .mn>*{max-width:1100px}
 .kpis{grid-template-columns:repeat(4,1fr)}.dgrid{grid-template-columns:1fr 1fr}
 .g{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(4,1fr)}
 .fab{bottom:24px;left:24px}
 .aip{left:24px;right:auto;bottom:90px;width:420px;height:600px;border-radius:28px}
 .aibk{display:none}
}
@media(max-width:380px){.g{grid-template-columns:1fr}}

/* ===== v5 ===== */
.brand{display:flex;gap:14px;align-items:center}.bl{display:none;width:64px;height:64px;border-radius:50%;overflow:hidden;border:3px solid #ffb000;background:#fff;flex:none}.bl img{width:100%;height:100%;object-fit:cover}
.mh em{display:none;font-style:normal;color:#ffd77a;font-size:12px}
.top{position:relative;overflow:hidden}.top:before,.top:after{content:"";position:absolute;border-radius:50%;background:rgba(255,176,0,.14)}.top:before{width:260px;height:260px;top:-120px;inset-inline-end:-60px}.top:after{width:160px;height:160px;bottom:-80px;inset-inline-start:30%}
.top>*{position:relative;z-index:1}
.act{display:flex;gap:10px;flex-wrap:wrap}.btn.s{display:inline-flex;align-items:center;gap:6px}
.btn.xb{background:#0a8f5a;color:#fff}.btn.pbn{background:var(--blue);color:#fff}
.hd b{color:var(--tx)}
.hb2{display:grid;gap:2px}.hr{display:grid;grid-template-columns:96px 1fr 72px;gap:10px;align-items:center;margin:7px 0;font-size:13px}.hr i{background:#eef1fa;border-radius:10px;height:14px;overflow:hidden}.hr u{display:block;height:100%;border-radius:10px}.hr b{text-align:end}
.kpi:nth-child(1){border-top:4px solid #3a52d4}.kpi:nth-child(2){border-top:4px solid #0aa56b}.kpi:nth-child(3){border-top:4px solid #ffb000}.kpi:nth-child(4){border-top:4px solid #e5484d}
.pb,.pb *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pb{font-family:Vazirmatn,Tahoma,sans-serif;color:#001166;border:2px solid #001166;border-radius:18px;overflow:hidden;background:#fff}
.ph{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#001166,#2140c8);color:#fff;padding:18px 22px;border-bottom:5px solid #ffb000}
.pl{width:78px;height:78px;border-radius:50%;background:#fff;color:#001166;display:grid;place-items:center;overflow:hidden;font:700 30px Georgia,serif;border:3px solid #ffb000;flex:none}.pl img{width:100%;height:100%;object-fit:cover}
.pt{flex:1;text-align:center}.pt b{display:block;font-size:22px}.pt span{display:block;color:#ffc800;font-style:italic}.pt small{opacity:.9}
.pk{text-align:center;background:#ffb000;color:#001166;border-radius:14px;padding:10px 16px}.pk em{font-style:normal;display:block;font-weight:900}.pk b{display:block;font-size:24px}
.pi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 22px}.pi div{background:#eef1fa;border-radius:10px;padding:6px 10px;font-weight:900}.pi span{display:block;font-size:11px;color:#6f7a9c;font-weight:400}
.pb table{width:calc(100% - 44px);margin:6px 22px;border-collapse:collapse;white-space:normal;font-size:13px}.pb th{background:#001166;color:#fff;padding:8px}.pb td{padding:7px;border-bottom:1px solid #d6dcea;text-align:center}.pb tr:nth-child(even) td{background:#f5f7fd}
.ps{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;padding:14px 22px}.ps div{border:2px solid #001166;border-radius:12px;padding:8px;text-align:center}.ps span{display:block;font-size:11px;color:#6f7a9c}.ps b{font-size:16px}.ps .r{background:#001166;color:#fff}.ps .r span{color:#ffc800}
.pg{display:flex;justify-content:space-between;padding:34px 40px 14px}.pg span{border-top:2px dashed #001166;padding-top:6px;min-width:170px;text-align:center}

 fa:{home:'صفحه اصلی',stock:'موجودی',debt:'طلب',set:'تنظیمات',login:'وارد شوید',user:'گذرواژه را وارد کنید',pass:'رمز را وارد کنید',welcome:'به دیتابیس',desc:'خوش آمدید',forgot:'فراموشی گذرواژه یا رمز؟',rcode:'کود بازیابی را وارد کنید',newuser:'گذرواژه جدید',newpass:'رمز جدید (حداقل ۶ حرف)',reset:'بازیابی',footer:'طراح: عبدالحنان مولانی · اطلاعات داخل همین مرورگر ذخیره می‌شود'},

function migrate(o){
  const stock=(o.buy||[]).map(x=>{const units=[];for(let i=0;i<(x.q||0);i++)units.push({imei:(x.imeis||[])[i]||'',color:x.col||'',price:x.price||0,sold:i>=x.left});

function calc(p){

function addBuy(){const g=i=>$(i).value.trim();

  if(!name||!model||!(q>0))return err('b_er','نام، مدل و تعداد ضروری است');

  const paid=Math.min(+$('b_paid').value||0,total);
  db.stock.push({id:Date.now(),no:nextNo(db.stock.filter(x=>x.src=='buy')),date:g('b_date')||sh(),src:'buy',company:name,fa:g('b_fa'),tz:g('b_tz'),gr:g('b_gr'),model,mem:$('b_mem').value,ram:$('b_ram').value,sim:$('b_sim').value,ty:$('b_ty').value,cur:$('b_cur').value,units:u,total,paid,rem:total-paid,bijak:'',hand:'',rate:db.set.rate});
  save();tab='buy';R()}
function addImp(){const g=i=>$(i).value.trim();
  const q=Math.floor(+$('i_q').value),co=g('i_co'),model=g('i_model');
  if(!co||!model||!(q>0))return err('i_er','برند یا شرکت، مدل و تعداد ضروری است');
  const u=collect('i',q),total=u.reduce((a,x)=>a+x.price,0);if(!total)return err('i_er','قیمت خرید را وارد کنید');
  db.stock.push({id:Date.now(),no:nextNo(db.stock.filter(x=>x.src=='import')),date:g('i_date')||sh(),src:'import',company:co,fa:'',tz:'',gr:'',model,mem:$('i_mem').value,ram:$('i_ram').value,sim:$('i_sim').value,ty:$('i_ty').value,cur:$('i_cur').value,units:u,total,paid:total,rem:0,bill:g('i_bill'),bijak:g('i_bijak'),hand:$('i_hand').value,qty:q,rate:db.set.rate});
  save();tab='imp';R()}
function addSell(){
  const s=db.stock.find(x=>x.id==$('s_stock').value),q=Math.floor(+$('s_q').value),cust=$('s_cust').value.trim();
  if(!s)return err('s_er','جنس را از اجناس موجود انتخاب کنید');
  if(!cust)return err('s_er','نام مشتری را وارد کنید');
  const av=s.units.filter(u=>!u.sold);
  if(!(q>0))return err('s_er','تعداد درست نیست');
  if(q>av.length)return err('s_er','موجودی کافی نیست. موجودی: '+av.length);
  const common=+$('s_pr').value||0,picked=av.slice(0,q);
  const su=picked.map((u,i)=>({imei:u.imei,color:u.color,price:(+$('s_p'+i)?.value)||common,cost:u.price}));
  const total=su.reduce((a,x)=>a+x.price,0);if(!total)return err('s_er','قیمت فروش را وارد کنید');
  const paid=Math.min(+$('s_paid').value||0,total);
  picked.forEach(u=>u.sold=true);
  const cur=$('s_cur').value;
  const pf=su.reduce((a,x)=>a+(toA(x.price,cur)-toA(x.cost,s.cur,s.rate)),0);
  db.sell.push({id:Date.now(),no:bjNo(),date:$('s_date').value||sh(),stockId:s.id,cust,fa:$('s_fa').value.trim(),tz:$('s_tz').value.trim(),tel:$('s_tel').value.trim(),model:s.model,mem:s.mem,ram:s.ram,sim:s.sim,ty:s.ty,col:$('s_col').value,cur,units:su,q,total,paid,rem:total-paid,pr:$('s_due').value.trim(),pf,rate:db.set.rate,wd:+($('s_wd')?.value)||0});
  const sid=db.sell[db.sell.length-1].id;save();
  if(confirm('فروش ثبت شد. بیجک چاپ شود؟'))printBijak(sid);
  $('s_er').textContent='';tab='sell';R()}

function delSell(id){const x=sellOf(id);if(!x||!confirm('این فروش به سطل بازیابی برود؟'))return;
  const s=db.stock.find(y=>y.id==x.stockId);if(s)x.units.forEach(su=>{const u=s.units.find(v=>v.sold&&v.imei==su.imei)||s.units.find(v=>v.sold);if(u)u.sold=false});

  if(!confirm('این خرید/واردات به سطل بازیابی برود؟'))return;
  db.stock=db.stock.filter(x=>x.id!=id);db.trash.push({id:Date.now(),t:'stock',at:sh(),rec:s});save();R()}
function rcv(id){const x=sellOf(id);const a=+prompt('مبلغ دریافتی ('+x.cur+') — باقی: '+fm(x.rem));
  if(a>0){const v=Math.min(a,x.rem);x.paid+=v;x.rem-=v;save();R()}}
function restore(j){const t=db.trash[j];
  if(t.t=='sell'){const r=t.rec,s=db.stock.find(y=>y.id==r.stockId);
    if(s)r.units.forEach(su=>{const u=s.units.find(v=>!v.sold&&su.imei&&v.imei==su.imei)||s.units.find(v=>!v.sold);if(u)u.sold=true});
    db.sell.push(r)}
  else db.stock.push(t.rec);

function loginHTML(){return `<div class="lscreen"><div class="login"><div style="text-align:left;margin-bottom:10px">${langSel()}</div><div class="circle"><img src="${db.set.loginImg||LOGIN_DEF}"></div>
  <h3>${TR('welcome')} <span>رحمانی موبایل</span> ${TR('desc')}</h3>
  <input id="lu" placeholder="${TR('user')}" autocomplete="username" style="border-radius:40px">
  <input id="lp" type="password" placeholder="${TR('pass')}" autocomplete="current-password" style="border-radius:40px" onkeydown="if(event.key=='Enter')login()">
  <button class="btn" onclick="login()">${TR('login')}</button><div class="er" id="le"></div>
  <div class="fp"><button class="fpb" onclick="var b=$('fpBox');b.style.display=b.style.display=='block'?'none':'block'">${TR('forgot')}</button>
    <div id="fpBox" class="fpbox" style="display:none">
      <input id="fc" placeholder="${TR('rcode')}" autocomplete="off" style="border-radius:40px">
      <input id="fu" placeholder="${TR('newuser')}" autocomplete="off" style="border-radius:40px">
      <input id="fpw" type="password" placeholder="${TR('newpass')}" autocomplete="new-password" style="border-radius:40px">
      <button class="btn" onclick="fpReset()">${TR('reset')}</button><div class="er" id="fe"></div></div></div>
  </div></div>`}

const MN=['حمل','ثور','جوزا','سرطان','اسد','سنبله','میزان','عقرب','قوس','جدی','دلو','حوت'];
function monthly(){const m={};
  db.sell.forEach(x=>{const p=String(x.date||'').split('/');if(p.length<2||!p[1])return;const k=p[0]+'/'+String(+p[1]).padStart(2,'0');
    m[k]=m[k]||{s:0,p:0};m[k].s+=toA(x.total,x.cur,x.rate);m[k].p+=(+x.pf||0)});
  return Object.keys(m).sort().slice(-6).map(k=>({lbl:MN[(+k.split('/')[1]-1)]||k,s:m[k].s,p:m[k].p}))}
const emptyBox=t=>`<div class="empty">${t}</div>`;
function barSVG(d,key){
  if(!d.length)return emptyBox('هنوز فروشی ثبت نشده');
  const W=600,H=260,top=24,base=220,max=Math.max(1,...d.map(x=>x[key])),n=d.length,slot=(W-40)/n,bw=Math.min(56,slot*.55);
  let g='';for(let i=0;i<=4;i++){const y=top+(base-top)*i/4;g+=`<line x1="20" x2="${W-20}" y1="${y}" y2="${y}" stroke="#e6ecf8"/>`}
  let b='';d.forEach((x,i)=>{const h=(x[key]/max)*(base-top),cx=20+slot*i+slot/2,y=base-h;
    b+=`<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${Math.max(h,2)}" rx="8" fill="${i==n-1?'#4a63c9':'#a9b8e8'}"/><text x="${cx}" y="${y-8}" text-anchor="middle">${fm(x[key])}</text><text class="ml" x="${cx}" y="${base+26}" text-anchor="middle">${esc(x.lbl)}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}${b}</svg>`}
function lineSVG(d,key){
  if(!d.length)return emptyBox('هنوز فروشی ثبت نشده');
  const W=600,H=260,top=24,base=220,vals=d.map(x=>x[key]),mx=Math.max(1,...vals),mn=Math.min(0,...vals),rg=(mx-mn)||1,n=d.length;
  const xs=i=>n==1?W/2:40+i*((W-80)/(n-1)),ys=v=>base-(v-mn)/rg*(base-top);
  let g='';for(let i=0;i<=4;i++){const y=top+(base-top)*i/4;g+=`<line x1="20" x2="${W-20}" y1="${y}" y2="${y}" stroke="#e6ecf8"/>`}
  const pts=d.map((x,i)=>[xs(i),ys(x[key])]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=path+` L${pts[n-1][0].toFixed(1)} ${base} L${pts[0][0].toFixed(1)} ${base} Z`;
  const dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="#fff" stroke='#4a63c9' stroke-width="3"/><text x="${p[0]}" y="${p[1]-12}" text-anchor="middle">${fm(d[i][key])}</text><text class="ml" x="${p[0]}" y="${base+26}" text-anchor="middle">${esc(d[i].lbl)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}<path d="${area}" fill="rgba(74,99,201,.16)"/><path d="${path}" fill="none" stroke='#4a63c9' stroke-width="3" stroke-linejoin="round"/>${dots}</svg>`}

/* ---- password hashing (salted PBKDF2; old hashes still accepted and upgraded on login) ---- */
const rndHex=()=>[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,'0')).join('');
async function pbk(v,salt){try{const enc=new TextEncoder();const k=await crypto.subtle.importKey('raw',enc.encode(String(v)),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc.encode(String(salt||'')),iterations:120000},k,256);
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return await hx(salt+'|'+v)}}
const vhash=async(v,salt)=>'v2:'+await pbk(v,salt);
const vok=async(stored,v,salt)=>{if(!stored)return false;return String(stored).startsWith('v2:')?stored===await vhash(v,salt):stored===await hx(v)};
